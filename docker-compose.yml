services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: appointments
      POSTGRES_PASSWORD: appointments
      POSTGRES_DB: appointments
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U appointments -d appointments']
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '${API_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://appointments:appointments@postgres:5432/appointments
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-change-me-dev-only-secret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      MAIL_TRANSPORT: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      MAIL_FROM: 'Appointments <no-reply@example.com>'

volumes:
  postgres-data:
